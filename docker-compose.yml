services:
  db:
    image: postgres:16
    container_name: marketscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketscope
      POSTGRES_USER: marketscope
      POSTGRES_PASSWORD: marketscope_dev
    ports:
      - "5432:5432"
    volumes:
      - marketscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketscope -d marketscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketscope_pgdata:
